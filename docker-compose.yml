services:
  mysql:
    image: mysql:8.4
    container_name: bass-clef
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bass-clef
      MYSQL_USER: root
      MYSQL_PASSWORD: Corpcapsule13313
      MYSQL_ROOT_PASSWORD: Corpcapsule13313
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: